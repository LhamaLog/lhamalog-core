# Desenvolvimento local do lhamalog-core. Nao e producao.
# Producao: compose.prod.yaml (rascunho nao validado, nao carregado por este comando).
# Na raiz, depois de copiar .env.example para .env:
#   docker compose up -d --build
# O projeto permanece lhamalog-core-local para reutilizar os volumes ja criados.
# Nao use down -v, volume prune nem system prune.
# A API escuta na rede do container; a publicacao no host fica só em 127.0.0.1.
# Nao defina server.address=127.0.0.1 dentro do container: o mapeamento deixaria de alcancar o processo.
name: lhamalog-core-local

include:
  - path: infra/local/compose.yaml

services:
  api:
    build:
      context: .
      dockerfile: infra/local/Dockerfile
    image: lhamalog-core-api:local
    container_name: lhamalog-core-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MONGODB_URI: "mongodb://${MONGO_APP_USERNAME:-lhamalog}:${MONGO_APP_PASSWORD:?defina MONGO_APP_PASSWORD no .env}@mongo:27017/${MONGO_APP_DATABASE:-lhamalog_core}?authSource=${MONGO_APP_DATABASE:-lhamalog_core}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      OTLP_ENABLED: ${OTLP_ENABLED:-false}
      OTLP_METRICS_URL: ${OTLP_METRICS_URL:-http://openobserve:5080/api/default/v1/metrics}
      OTLP_TRACES_URL: ${OTLP_TRACES_URL:-http://openobserve:5080/api/default/v1/traces}
      OPENOBSERVE_AUTH: ${OPENOBSERVE_AUTH:-}
      CLERK_ISSUER: ${CLERK_ISSUER:?defina CLERK_ISSUER (Frontend API URL da Clerk) no .env}
      CLERK_JWKS_URI: ${CLERK_JWKS_URI:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:5173}
      CLERK_ADMIN_ROLES: ${CLERK_ADMIN_ROLES:-admin}
      # Opcionais no local: sem a secret key o 403 nao revoga sessoes; sem o signing secret os webhooks sao rejeitados.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      # Cria um Tenant ACTIVE para esta organizacao ao subir (sem Tenant, toda chamada responde 403 e desloga).
      DEV_TENANT_CLERK_ORG_ID: ${DEV_TENANT_CLERK_ORG_ID:-}
      # Spec 012 (LLT-135): true grava 12 ocorrencias de exemplo por produto ao subir, sem duplicar.
      OCCURRENCE_SAMPLE_DATA: ${OCCURRENCE_SAMPLE_DATA:-false}
      # Spec 013 (LLT-293): JWT interno das rotas /internal/v1 do Modulo Ocorrencia. Sem segredo, elas recusam tudo.
      OCCURRENCE_INTERNAL_JWT_SECRETS: ${OCCURRENCE_INTERNAL_JWT_SECRETS:-}
      OCCURRENCE_INTERNAL_JWT_ISSUER: ${OCCURRENCE_INTERNAL_JWT_ISSUER:-lhamalog-internal}
      OCCURRENCE_INTERNAL_JWT_AUDIENCE: ${OCCURRENCE_INTERNAL_JWT_AUDIENCE:-lhamalog-modulo-ocorrencia}
      # Só a rota POST /internal/v1/alertas/finder exige esta audiência. Não é segredo.
      OCCURRENCE_INTERNAL_JWT_CORE_AUDIENCE: ${OCCURRENCE_INTERNAL_JWT_CORE_AUDIENCE:-lhamalog-core}
      OCCURRENCE_INTERNAL_JWT_SUBJECTS: ${OCCURRENCE_INTERNAL_JWT_SUBJECTS:-lhamalog-finder}
      # Contratacao com o Asaas simulado (LLT-289). Sem token, o Core gera um ao subir.
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      BILLING_RETURN_URL: ${BILLING_RETURN_URL:-http://localhost:5173/empresa}
      BILLING_FAKE_CHECKOUT_BASE_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # TLS local do Finder (spec 016): HTTPS na frente do Core, que segue em HTTP na porta 8080.
  # A base do Finder é https:// sem caminho. A CA local (SSL_CERT_FILE) fica na spec do Finder.
  # Tag fixa; sem segredo neste serviço.
  caddy:
    image: caddy:2.10.2
    container_name: lhamalog-core-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CADDY_HTTPS_PORT:-8443}:443"
    command:
      - caddy
      - reverse-proxy
      - --from
      - https://:443
      - --to
      - http://api:8080
      - --internal-certs
