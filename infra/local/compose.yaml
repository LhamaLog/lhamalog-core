# MongoDB e Redis do lhamalog-core (somente desenvolvimento) - ADR_151.
# Incluido pelo compose.yaml da raiz. Tambem pode subir sozinho, com o mesmo
# nome de projeto e os mesmos volumes (lhamalog-core-local_mongo-data e _redis-data).
# OpenObserve saiu deste arquivo e foi para compose.observability.yaml; o volume antigo nao e apagado.
# Obrigatorio: .env na raiz (docker compose up) ou infra/local/.env se este arquivo for o principal.
# Nao use down -v. Tags fixas: as mesmas de src/test/java/.../TestcontainersConfiguration.java.
name: lhamalog-core-local

services:
  # Banco do Core (ADR_116).
  mongo:
    image: mongo:8.0.34
    container_name: lhamalog-core-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:-lhamalog_core}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-lhamalog_core}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-lhamalog}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?defina MONGO_APP_PASSWORD no .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.2.10
    container_name: lhamalog-core-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    environment:
      # redis-cli le a senha desta variavel no healthcheck, sem expor em argumento.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
  redis-data:
