# Configuracao base, comum a todos os perfis (ADR_151).
# Valores especificos de ambiente ficam em application-local.properties e application-prod.properties.
spring.application.name=lhamalog-core

# Cria os indices declarados nos documentos (@CompoundIndex de Produto e AcessoProduto).
# Os indices de tenant, member e clerk_webhook_event sao criados pelos proprios repositorios.
spring.data.mongodb.auto-index-creation=true

# Perfil usado quando nenhum perfil e informado: local (maquina do desenvolvedor).
# Em producao o perfil e sempre explicito: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

server.port=${SERVER_PORT:8080}
# Manual upload (LLT-292): 100 MB per file and per request. These limits stay in properties/profile, never in .env.
# Keep spring.servlet.multipart.max-* in sync with lhamalog.manual-upload.max-* (413 messages are derived from the latter).
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB
# Boot 4.1.1 defaults made explicit: 50 parts = productId + at most 49 files; long part headers can also trip 413.
server.tomcat.max-part-count=50
server.tomcat.max-part-header-size=512B

lhamalog.manual-upload.allowed-extensions=txt,json,csv,log
lhamalog.manual-upload.collector-url=${LHAMALOG_MANUAL_UPLOAD_COLLECTOR_URL:http://localhost:8080}
lhamalog.manual-upload.connect-timeout=5s
lhamalog.manual-upload.timeout=120s
lhamalog.manual-upload.max-file-size=100MB
lhamalog.manual-upload.max-request-size=100MB

# Actuator: expoe apenas health e info pela web.
management.endpoints.web.exposure.include=health,info

# Clerk (LLT-163, ADR_022/032). CLERK_ISSUER e obrigatoria em todos os perfis: sem ela a aplicacao nao sobe.
# CLERK_ISSUER = Frontend API URL da instancia da Clerk (sem barra final). O JWKS padrao e <issuer>/.well-known/jwks.json.
clerk.issuer=${CLERK_ISSUER}
clerk.jwks-uri=${CLERK_JWKS_URI:}
clerk.clock-skew=${CLERK_CLOCK_SKEW:5s}
clerk.api-url=${CLERK_API_URL:https://api.clerk.com}

# Webhooks da Clerk (LLT-164): tolerancia do svix-timestamp. O segredo fica nos perfis.
clerk.webhook.tolerance=${CLERK_WEBHOOK_TOLERANCE:5m}

# Exportacao OTLP (metricas e traces). Liga/desliga com a variavel OTLP_ENABLED.
management.otlp.metrics.export.enabled=${OTLP_ENABLED:true}
management.tracing.export.otlp.enabled=${OTLP_ENABLED:true}

# Logging (LhamaLog standard v1)
lhamalog.logging.time-zone=America/Sao_Paulo
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,${lhamalog.logging.time-zone:America/Sao_Paulo}} %5p [${spring.application.name:-}] [cid=%X{correlationId:-none}] [%t] %logger{40}.%M - %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,${lhamalog.logging.time-zone:America/Sao_Paulo}} %5p [${spring.application.name:-}] [cid=%X{correlationId:-none}] [%t] %logger{40}.%M - %m%n%wEx

# Subscription delinquency grace (ADR_163 / LLT-183)
lhamalog.subscription.delinquency-grace=15d

# Contratacao de plano (LLT-289, spec 010). Para onde o navegador volta depois do pagamento.
lhamalog.billing.return-url=${BILLING_RETURN_URL:http://localhost:5173/empresa}
# Catalogo de planos: preco mensal em BRL por PlanTier. VALORES PROVISORIOS, so para desenvolvimento, ate a
# definicao comercial (LLT-229/230). Tier sem preco nao aparece no catalogo.
lhamalog.billing.plans.free.price=0.00
lhamalog.billing.plans.starter.price=49.90
lhamalog.billing.plans.pro.price=149.90
lhamalog.billing.plans.business.price=399.90
lhamalog.billing.plans.enterprise.price=999.90
