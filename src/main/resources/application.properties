# Configuracao base, comum a todos os perfis (ADR_151).
# Valores especificos de ambiente ficam em application-local.properties e application-prod.properties.
spring.application.name=lhamalog-core

# Cria os indices declarados nos documentos (@CompoundIndex de Produto e AcessoProduto).
# Os indices de tenant, member e clerk_webhook_event sao criados pelos proprios repositorios.
spring.data.mongodb.auto-index-creation=true

# Perfil usado quando nenhum perfil e informado: local (maquina do desenvolvedor).
# Em producao o perfil e sempre explicito: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

server.port=${SERVER_PORT:8080}

# Actuator: expoe apenas health e info pela web.
management.endpoints.web.exposure.include=health,info

# Clerk (LLT-163, ADR_022/032). CLERK_ISSUER e obrigatoria em todos os perfis: sem ela a aplicacao nao sobe.
# CLERK_ISSUER = Frontend API URL da instancia da Clerk (sem barra final). O JWKS padrao e <issuer>/.well-known/jwks.json.
clerk.issuer=${CLERK_ISSUER}
clerk.jwks-uri=${CLERK_JWKS_URI:}
clerk.clock-skew=${CLERK_CLOCK_SKEW:5s}
clerk.api-url=${CLERK_API_URL:https://api.clerk.com}

# Webhooks da Clerk (LLT-164): tolerancia do svix-timestamp. O segredo fica nos perfis.
clerk.webhook.tolerance=${CLERK_WEBHOOK_TOLERANCE:5m}

# Exportacao OTLP (metricas e traces). Liga/desliga com a variavel OTLP_ENABLED.
management.otlp.metrics.export.enabled=${OTLP_ENABLED:true}
management.tracing.export.otlp.enabled=${OTLP_ENABLED:true}
