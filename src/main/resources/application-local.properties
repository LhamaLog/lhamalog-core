# Perfil local: roda na maquina do desenvolvedor (ADR_151), contra o compose.yaml da raiz.
# Qualquer valor pode ser sobrescrito por variavel de ambiente (ex.: $env:MONGODB_URI no PowerShell).
# Nenhum segredo aqui: senhas so por variavel de ambiente (ver .env.example na raiz).

# MongoDB (banco do Core - ADR_116). Com o compose local, informe usuario e senha da aplicacao:
#   MONGODB_URI=mongodb://<usuario>:<senha>@localhost:27017/lhamalog_core?authSource=lhamalog_core
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:${MONGO_PORT:27017}/lhamalog_core}

# Redis (senha obrigatoria no compose local: REDIS_PASSWORD)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# OpenObserve local (ADR_168): recebe metricas e traces por OTLP/HTTP em /api/<org>/v1/*.
# OPENOBSERVE_AUTH = "Basic " + base64(usuario:senha). Sem o OpenObserve no ar? Use OTLP_ENABLED=false.
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:${OPENOBSERVE_PORT:5080}/api/${OPENOBSERVE_ORGANIZATION:default}/v1/metrics}
management.otlp.metrics.export.headers.Authorization=${OPENOBSERVE_AUTH:}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_URL:http://localhost:${OPENOBSERVE_PORT:5080}/api/${OPENOBSERVE_ORGANIZATION:default}/v1/traces}
management.opentelemetry.tracing.export.otlp.headers.Authorization=${OPENOBSERVE_AUTH:}
management.tracing.sampling.probability=1.0

# Diagnostico local
management.endpoint.health.show-details=always
logging.level.br.com.lhamalog=DEBUG