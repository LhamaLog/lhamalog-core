# Perfil local: roda na maquina do desenvolvedor (ADR_151), contra os servicos de infra/local/compose.yaml.
# Qualquer valor pode ser sobrescrito por variavel de ambiente (ex.: $env:MONGODB_URI no PowerShell).
# Nenhum segredo aqui: senhas so por variavel de ambiente (ver infra/local/.env.example).

# MongoDB (banco do Core - ADR_116). Com o compose local, informe usuario e senha da aplicacao:
#   MONGODB_URI=mongodb://<usuario>:<senha>@localhost:27017/lhamalog_core?authSource=lhamalog_core
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:${MONGO_PORT:27017}/lhamalog_core}

# Redis (senha obrigatoria no compose local: REDIS_PASSWORD)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# OpenObserve local (ADR_168): recebe metricas e traces por OTLP/HTTP em /api/<org>/v1/*.
# OPENOBSERVE_AUTH = "Basic " + base64(usuario:senha). Sem o OpenObserve no ar? Use OTLP_ENABLED=false.
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:${OPENOBSERVE_PORT:5080}/api/${OPENOBSERVE_ORGANIZATION:default}/v1/metrics}
management.otlp.metrics.export.headers.Authorization=${OPENOBSERVE_AUTH:}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_URL:http://localhost:${OPENOBSERVE_PORT:5080}/api/${OPENOBSERVE_ORGANIZATION:default}/v1/traces}
management.opentelemetry.tracing.export.otlp.headers.Authorization=${OPENOBSERVE_AUTH:}
management.tracing.sampling.probability=1.0

# Clerk (instancia de desenvolvimento). CLERK_ISSUER vem do ambiente (application.properties).
# Origens permitidas (azp e CORS), separadas por virgula: lhamalog-web e projeto de teste usam a porta 5173.
clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES:http://localhost:5173}
# Secret key da Backend API (revogacao de sessoes no 403). Vazia: a revogacao e pulada com aviso no log.
clerk.secret-key=${CLERK_SECRET_KEY:}
# Signing secret do endpoint de webhook (Dashboard da Clerk > Webhooks). Vazio: todo webhook e rejeitado (400).
clerk.webhook.signing-secret=${CLERK_WEBHOOK_SIGNING_SECRET:}
# Tenant de desenvolvimento: org_id da organizacao da Clerk que deve ter um Tenant ACTIVE ao subir.
# Enquanto o fluxo de compra nao existe, sem Tenant toda chamada responde 403 e desloga. Vazio: nada e criado.
lhamalog.dev-tenant.clerk-org-id=${DEV_TENANT_CLERK_ORG_ID:}

# Diagnostico local
management.endpoint.health.show-details=always
logging.level.br.com.lhamalog=DEBUG